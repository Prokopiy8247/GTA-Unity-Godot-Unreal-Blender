name: Unreal project checks
on:
  push:
    paths:
      - 'Unreal Engine 5 GTA/**'
      - '.github/workflows/unreal-public-checks.yml'
  pull_request:
    paths:
      - 'Unreal Engine 5 GTA/**'
      - '.github/workflows/unreal-public-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Check private files and personal paths
        run: python3 "Unreal Engine 5 GTA/Tools/audit_publication.py" "Unreal Engine 5 GTA"
      - name: Scan for secrets with pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 3 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/gitleaks" dir "Unreal Engine 5 GTA" --redact --no-banner --max-target-megabytes 100
      - name: Validate Mac launch scripts
        shell: bash
        run: |
          bash -n "Unreal Engine 5 GTA/Tools/launch_macos.sh"
          bash -n "Unreal Engine 5 GTA/Launch_PortMeridian.command"
          bash -n "Unreal Engine 5 GTA/Open_Editor.command"
